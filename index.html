<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tomiapps | こどもと家族のためのアプリ</title>
<meta name="description" content="tomiapps は、こどもと家族のためのアプリを作る個人開発ブランドです。">
<link rel="canonical" href="https://tomiapps.github.io/">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Yu Gothic', sans-serif;
    background: #FFF8F0; color: #4E342E;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  h1 { color: #E65100; font-size: 2rem; margin-bottom: 8px; }
  p.lead { color: #6D5B54; margin-bottom: 40px; }
  a.app-card {
    display: flex; align-items: center; gap: 18px;
    background: #fff; border: 3px solid #FFE0B2; border-radius: 20px;
    padding: 20px 26px; text-decoration: none; color: inherit;
    max-width: 420px; width: 100%;
    box-shadow: 0 6px 20px rgba(239, 108, 0, 0.1);
    transition: transform 0.15s;
  }
  a.app-card:hover { transform: translateY(-3px); }
  .app-icon { font-size: 2.4rem; }
  .app-name { font-weight: bold; font-size: 1.15rem; color: #E65100; }
  .app-desc { font-size: 0.85rem; color: #6D5B54; margin-top: 2px; }
  footer { margin-top: 48px; font-size: 0.8rem; color: #B0A49C; }
</style>
</head>
<body>
  <h1>tomiapps</h1>
  <p class="lead">こどもと家族のための、あそべるアプリをつくっています。</p>
  <a class="app-card" href="https://tomiapps.github.io/oekaki-kuruma/">
    <span class="app-icon">🖍️🚗</span>
    <span>
      <span class="app-name">おえかきくるま</span><br>
      <span class="app-desc">描いたクルマが、走り出す！3歳からの知育×お絵描きアプリ(Google Play で公開中)</span>
    </span>
  </a>
  <footer>&copy; 2026 tomiapps</footer>
</body>
</html>
